name: Build cuDCT

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux build
    runs-on: ubuntu-latest

    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y \
            python3 \
            python3-dev \
            python3-pip \
            build-essential \
            cmake \
            ninja-build \
            git

      - name: Install Python build deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install scikit-build-core pybind11 ninja build wheel

      - name: Build wheel
        env:
          CMAKE_GENERATOR: Ninja
          CUDACXX: /usr/local/cuda/bin/nvcc
        run: |
          python3 -m build --wheel

      - name: Install wheel
        run: |
          python3 -m pip install dist/*.whl

      - name: Import test
        run: |
          python3 - <<'PY'
          import cuDCT
          import cuDCT.native
          print("cuDCT imported successfully")
          print(cuDCT.__file__)
          PY

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: cuDCT-linux-wheel
          path: dist/*.whl

  build-windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: "12.4.1"
          method: network

      - name: Check CUDA
        shell: pwsh
        run: |
          where nvcc
          nvcc --version
          echo "CUDA_PATH=$env:CUDA_PATH"

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core pybind11 ninja build wheel

       - name: Build wheel
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          CUDACXX: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\nvcc.exe
          CUDAHOSTCXX: cl.exe
          CMAKE_ARGS: "-DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler"
        run: |
          python -m build --wheel

      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName

      - name: Import test
        run: |
          python - <<'PY'
          import cuDCT
          import cuDCT.native
          print("cuDCT imported successfully")
          print(cuDCT.__file__)
          PY

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: cuDCT-windows-wheel
          path: dist/*.whl
