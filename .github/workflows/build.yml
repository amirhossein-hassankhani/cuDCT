name: Build cuDCT

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux wheel
    runs-on: ubuntu-latest

    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y \
            python3 \
            python3-dev \
            python3-pip \
            build-essential \
            git

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            scikit-build-core \
            pybind11 \
            build \
            wheel

      - name: Build wheel
        env:
          CMAKE_GENERATOR: Ninja
          CUDACXX: /usr/local/cuda/bin/nvcc
        run: |
          python3 -m build --wheel

      - name: Install wheel
        run: |
          python3 -m pip install dist/*.whl

      - name: Import test
        run: |
          python3 - <<'PY'
          import cuDCT
          import cuDCT.native

          print("cuDCT imported successfully")
          print(cuDCT.__file__)
          PY

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: cuDCT-linux-wheel
          path: dist/*.whl
